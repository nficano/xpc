name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      codename: ${{ steps.meta.outputs.codename }}
      title: ${{ steps.meta.outputs.title }}
    steps:
      - uses: actions/checkout@v4
      - name: Install debaser
        shell: bash
        run: |
          set -euo pipefail
          repo="nficano/debaser"
          version="$(curl -fsSL "https://api.github.com/repos/${repo}/releases/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          target="x86_64-unknown-linux-gnu"
          asset="debaser-${version}-${target}.tar.gz"
          base="https://github.com/${repo}/releases/download/${version}"
          curl -fsSL "$base/$asset" -o "$asset"
          tar -xzf "$asset"
          sudo install -m 0755 "debaser-${version}-${target}/debaser" /usr/local/bin/debaser
          debaser --version || true
      - id: meta
        name: Compute version + codename
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -f VERSION ] && [ "$(tr -d '[:space:]' < VERSION)" != "$version" ]; then
            echo "warning: tag $GITHUB_REF_NAME does not match VERSION file ($(tr -d '[:space:]' < VERSION))" >&2
          fi
          codename="$(debaser --checksum "$GITHUB_SHA")"
          title="v${version} — ${codename}"
          {
            echo "version=$version"
            echo "codename=$codename"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: $title"

  build:
    name: build (${{ matrix.os }} / ${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
          - os: ubuntu-latest
            goos: linux
            arch: arm64
          - os: macos-latest
            goos: darwin
            arch: amd64
          - os: macos-latest
            goos: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CODENAME: ${{ needs.prepare.outputs.codename }}
        run: |
          mkdir -p dist
          go build \
            -ldflags "-s -w \
              -X github.com/nficano/xpc/internal/version.Version=${VERSION} \
              -X github.com/nficano/xpc/internal/version.Codename=${CODENAME}" \
            -o "dist/xpc-${GOOS}-${GOARCH}" \
            ./cmd/xpc
      - uses: actions/upload-artifact@v4
        with:
          name: xpc-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/xpc-${{ matrix.goos }}-${{ matrix.arch }}

  publish:
    name: publish github release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.prepare.outputs.title }}
          CODENAME: ${{ needs.prepare.outputs.codename }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "**Codename:** ${CODENAME}"
            echo ""
            echo "_Release name generated deterministically from commit \`${GITHUB_SHA}\` via [debaser](https://github.com/nficano/debaser)._"
          } > "$notes_file"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TITLE}" \
            --notes-file "$notes_file" \
            --generate-notes \
            dist/xpc-*
