version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - revive
  settings:
    errcheck:
      # Writes to stdout/stderr are intentionally fire-and-forget in a CLI.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - (*os.File).Write
        - (*os.File).WriteString
    revive:
      rules:
        - name: var-naming
        - name: package-comments
        - name: exported

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
